<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutyaház Dashboard</title>
    <!-- MQTT.js betöltése -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #fb923c; text-align: center; font-size: 1.5rem; margin-bottom: 5px; margin-top: 0; }
        #status { text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: background 0.3s; }
        
        /* Üzemmód jelző sáv */
        #mode-badge { text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; padding: 6px; border-radius: 8px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; }

        /* Időjárás és előfűtés kártya */
        .weather-box { background: rgba(30, 58, 138, 0.4); border: 1px solid #3b82f6; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 0.85rem; }
        .weather-title { font-weight: bold; color: #93c5fd; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .boost-badge { display: none; margin-top: 8px; background: #ea580c; color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; text-align: center; font-weight: bold; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; }
        .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px; border: 2px solid transparent; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 0.85rem; transition: all 0.2s; }
        button:active { opacity: 0.7; }
        
        .btn-auto { background: #2563eb; }
        .btn-on { background: #dc2626; }
        .btn-off { background: #475569; }

        /* Aktív gomb kiemelése vizuálisan */
        button.active-mode {
            border-color: #facc15 !important;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            transform: scale(1.02);
        }

        .battery-container { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .progress-bar { width: 100%; background: #475569; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
        .progress-fill { background: #22c55e; height: 100%; width: 0%; transition: width 0.5s; }
        input[type=number] { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; width: 60px; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐶 Kutyaház Dashboard</h1>
        <div id="status" style="color: #eab308;">Kapcsolódás a szerverhez...</div>
        
        <!-- Aktuális üzemmód kijelző -->
        <div id="mode-badge">Üzemmód: --</div>

        <!-- Időjárás & Intelligens Előfűtés Kijelző -->
        <div class="weather-box">
            <div class="weather-title">
                <span>🌙 Várható éjszakai min:</span>
                <span id="night-min-temp" style="color: #60a5fa;">Betöltés...</span>
            </div>
            <div id="boost-status" class="boost-badge">
                ⚡ Intelligens Előfűtés Aktív (+1.5 °C rásegítés)
            </div>
        </div>

        <div class="grid-2">
            <div class="box">
                <div class="label">Hőmérséklet</div>
                <div id="temp" class="value" style="color: #38bdf8;">--.- °C</div>
            </div>
            <div class="box">
                <div class="label">Fűtés Állapot</div>
                <div id="heater-state" class="value" style="font-size: 1rem; color: #cbd5e1; margin-top: 8px;">--</div>
            </div>
        </div>

        <div class="battery-container">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                <span class="label">Akku Feszültség:</span>
                <span id="vbat" style="font-weight: bold; color: #4ade80;">--.-- V</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 5px;">
                <span class="label">Töltöttség:</span>
                <span id="vpct" style="font-weight: bold; color: #4ade80;">-- %</span>
            </div>
            <div class="progress-bar">
                <div id="battery-bar" class="progress-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
                <span class="label">Fogyasztás:</span>
                <span id="wh" style="color: #c084fc;">--.-- Wh</span>
            </div>
        </div>

        <div class="label" style="margin-bottom: 5px;">Vezérlő Módok</div>
        <div class="btn-grid">
            <button id="btn-auto" class="btn-auto" onclick="sendCommand('mode auto')">Auto</button>
            <button id="btn-on" class="btn-on" onclick="sendCommand('heat on')">Fűtés BE</button>
            <button id="btn-off" class="btn-off" onclick="sendCommand('heat off')">Fűtés KI</button>
        </div>

        <div class="box" style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 0.85rem;">Célhőmérséklet:</span>
            <div>
                <input type="number" id="target-temp" value="12" step="0.5">
                <button onclick="sendTargetTemp()" style="background: #ea580c; padding: 6px 12px; margin-left: 5px; font-size: 0.85rem;">Állít</button>
            </div>
        </div>
    </div>

    <script>
        const topicTelemetry = "kutyahaz/12345/telemetry";
        const topicCommand = "kutyahaz/12345/command";
        const topicWeather = "kutyahaz/12345/weather";

        const statusEl = document.getElementById("status");
        const modeBadge = document.getElementById("mode-badge");
        
        const btnAuto = document.getElementById("btn-auto");
        const btnOn = document.getElementById("btn-on");
        const btnOff = document.getElementById("btn-off");

        let nightMinTemp = 0;
        let lastMessageTime = Date.now();

        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
            keepalive: 30,
            clientId: 'KutyahazWeb_' + Math.random().toString(16).substring(2, 8),
            reconnectPeriod: 2000
        });

        client.on('connect', () => {
            statusEl.innerText = "🟢 Szerverhez kapcsolódva...";
            statusEl.style.color = "#4ade80";
            client.subscribe(topicTelemetry);
            fetchNightWeather();
        });

        client.on('error', (err) => {
            statusEl.innerText = "🔴 Hálózati hiba";
            statusEl.style.color = "#f87171";
        });

        client.on('offline', () => {
            statusEl.innerText = "🟡 Elveszett a kapcsolat";
            statusEl.style.color = "#eab308";
        });

        client.on('message', (topic, message) => {
            if (topic === topicTelemetry) {
                lastMessageTime = Date.now();
                statusEl.innerText = "🟢 Online (ESP32 csatlakoztatva)";
                statusEl.style.color = "#4ade80";

                try {
                    const data = JSON.parse(message.toString());
                    
                    if(data.tin !== undefined) document.getElementById("temp").innerText = Number(data.tin).toFixed(1) + " °C";
                    if(data.vbat !== undefined) document.getElementById("vbat").innerText = Number(data.vbat).toFixed(2) + " V";
                    if(data.vpct !== undefined) {
                        document.getElementById("vpct").innerText = data.vpct + " %";
                        document.getElementById("battery-bar").style.width = Math.min(100, Math.max(0, data.vpct)) + "%";
                    }
                    if(data.wh !== undefined) document.getElementById("wh").innerText = Number(data.wh).toFixed(2) + " Wh";
                    
                    if(data.target !== undefined && document.activeElement !== document.getElementById("target-temp")) {
                        document.getElementById("target-temp").value = data.target;
                    }

                    // Előző aktív gombok resetelése
                    btnAuto.classList.remove("active-mode");
                    btnOn.classList.remove("active-mode");
                    btnOff.classList.remove("active-mode");

                    // Üzemmód vizuális megjelenítése és gombok színezése a valós ESP állapot alapján
                    if(data.mode !== undefined) {
                        if(data.mode === "auto") {
                            modeBadge.innerText = "🤖 Jelenlegi Mód: Automata (Termosztát)";
                            modeBadge.style.color = "#60a5fa";
                            modeBadge.style.borderColor = "rgba(96, 165, 250, 0.4)";
                            modeBadge.style.background = "rgba(96, 165, 250, 0.1)";
                            btnAuto.classList.add("active-mode");
                        } else if(data.mode === "on") {
                            modeBadge.innerText = "🔥 Jelenlegi Mód: Manuálisan BE";
                            modeBadge.style.color = "#f87171";
                            modeBadge.style.borderColor = "rgba(248, 113, 113, 0.4)";
                            modeBadge.style.background = "rgba(248, 113, 113, 0.1)";
                            btnOn.classList.add("active-mode");
                        } else if(data.mode === "off") {
                            modeBadge.innerText = "💤 Jelenlegi Mód: Manuálisan KI";
                            modeBadge.style.color = "#94a3b8";
                            modeBadge.style.borderColor = "rgba(148, 163, 184, 0.4)";
                            modeBadge.style.background = "rgba(148, 163, 184, 0.1)";
                            btnOff.classList.add("active-mode");
                        }
                    }

                    if(data.heat !== undefined) {
                        const hEl = document.getElementById("heater-state");
                        if(data.heat == 1) {
                            hEl.innerText = "AKTÍV 🔥";
                            hEl.style.color = "#f87171";
                        } else {
                            hEl.innerText = "Kikapcsolva 💤";
                            hEl.style.color = "#94a3b8";
                        }
                    }
                } catch (e) {
                    console.error("JSON hiba:", e);
                }
            }
        });

        setInterval(() => {
            if (client.connected) {
                const elapsed = Date.now() - lastMessageTime;
                if (elapsed > 6000) {
                    statusEl.innerText = "🔴 ESP32 kapcsolat megszakadt!";
                    statusEl.style.color = "#f87171";
                    modeBadge.innerText = "⚠️ Üzemmód: Ismeretlen (Offline)";
                    modeBadge.style.color = "#f87171";
                }
            }
        }, 1000);

        async function fetchNightWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.02&longitude=19.55&daily=temperature_2m_min&timezone=auto');
                const weatherData = await response.json();
                
                nightMinTemp = weatherData.daily.temperature_2m_min[0];
                document.getElementById("night-min-temp").innerText = nightMinTemp + " °C";

                if (client.connected) {
                    client.publish(topicWeather, String(nightMinTemp));
                }

                const boostBadge = document.getElementById("boost-status");
                if (nightMinTemp <= -5.0) {
                    boostBadge.style.display = "block";
                } else {
                    boostBadge.style.display = "none";
                }
            } catch (err) {
                console.error("Időjárási hiba:", err);
                document.getElementById("night-min-temp").innerText = "N/A";
            }
        }

        function sendCommand(cmd) {
            if (client.connected) {
                client.publish(topicCommand, cmd);
            } else {
                alert("Nincs kapcsolat a felhővel!");
            }
        }

        function sendTargetTemp() {
            let inputEl = document.getElementById("target-temp");
            let val = parseFloat(inputEl.value);
            if (!isNaN(val)) {
                sendCommand("set " + val);
            } else {
                alert("Kérlek, érvényes számot adj meg!");
            }
        }
    </script>
</body>
</html>
